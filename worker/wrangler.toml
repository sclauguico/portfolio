name = "sandy-twin"
main = "src/index.ts"
compatibility_date = "2025-01-15"

[ai]
binding = "AI"

# KV namespace for rate limiting state
# Create with: npx wrangler kv:namespace create RL_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "RL_KV"
id = "a8750245071b4d95a6daa42a4bfafe63"

[vars]
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODEL = "nvidia/nemotron-nano-9b-v2:free"
GROQ_MODEL = "llama-3.3-70b-versatile"
ALLOWED_ORIGINS = "https://sclauguico.github.io,http://localhost:4321"
LANGSMITH_PROJECT = "sandy-twin-prod"

# Secrets (set via `wrangler secret put OPENROUTER_API_KEY`):
# - OPENROUTER_API_KEY
# - GROQ_API_KEY  (fallback when Workers AI quota is exhausted)
# - LANGSMITH_API_KEY  (optional; if unset, no traces are logged)

# Served from *.workers.dev. To bind a custom domain later, register it,
# point its DNS at Cloudflare, then uncomment and adjust:
# [[routes]]
# pattern = "api.example.com/*"
# zone_name = "example.com"
